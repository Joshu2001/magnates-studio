<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Disc Sheen Gradient -->
    <radialGradient id="discSheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Jewel Case Glass Gradient -->
    <linearGradient id="jewelGlass1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#94a3b8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="jewelGlass2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Desk Blotter Mat Gradient -->
    <linearGradient id="blotterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <filter id="accessoryShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Left: Stack of 2 Jewel Cases with Discs inside (Perspective Flat on Table) -->
  <g id="jewelCasesGroup" filter="url(#accessoryShadow)">
    <!-- Bottom CD Jewel Case (Angled slightly) -->
    <g transform="translate(360, 560)">
      <!-- Case Base / Tray -->
      <polygon points="20,10 160,0 180,38 40,48" fill="url(#jewelGlass1)" stroke="#cbd5e1" stroke-width="1.2" stroke-opacity="0.5"/>
      <!-- Internal Disc -->
      <ellipse cx="100" cy="24" rx="48" ry="14" fill="url(#discSheen)" stroke="#f8fafc" stroke-width="0.8" opacity="0.75"/>
      <ellipse cx="100" cy="24" rx="14" ry="4" fill="#1e293b" stroke="#ffffff" stroke-width="0.8"/>
      <!-- Case Plastic Hinge & Edge Highlight -->
      <line x1="20" y1="10" x2="40" y2="48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Top CD Jewel Case (Stacked slightly offset) -->
    <g transform="translate(345, 574)">
      <!-- Case Base / Tray -->
      <polygon points="15,10 155,0 178,40 38,50" fill="url(#jewelGlass2)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
      <!-- Internal Disc -->
      <ellipse cx="96" cy="25" rx="50" ry="15" fill="url(#discSheen)" stroke="#f8fafc" stroke-width="1" opacity="0.85"/>
      <ellipse cx="96" cy="25" rx="15" ry="4.5" fill="#0f172a" stroke="#ffffff" stroke-width="1"/>
      <circle cx="96" cy="25" r="3" fill="#ffffff" opacity="0.9"/>
      <!-- Case Plastic Spine Rim Highlight -->
      <line x1="15" y1="10" x2="38" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="15" y1="10" x2="155" y2="0" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    </g>
  </g>

  <!-- Right: Minimalist Desk Mat / Blotter Pad -->
  <g id="deskMatGroup" filter="url(#accessoryShadow)">
    <g transform="translate(1030, 575)">
      <!-- Desk Blotter Trapezoid Perspective -->
      <polygon points="20,0 170,0 185,26 0,26" fill="url(#blotterGrad)" stroke="#64748b" stroke-width="1"/>
      <!-- Subtle Stitched Border Line -->
      <polygon points="24,3 166,3 179,23 5,23" fill="none" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6"/>
    </g>
  </g>
</svg>
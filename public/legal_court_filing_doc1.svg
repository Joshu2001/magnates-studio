  <text x="50%" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#4b5563" letter-spacing="1.5">Case 22-11068-JTD   Filed 11/14/22   Page 1 of 8</text>

  <text x="50%" y="68" text-anchor="middle" font-family="'Times New Roman', serif" font-size="16" font-weight="bold" fill="#111827" letter-spacing="1.2">IN THE UNITED STATES BANKRUPTCY COURT</text>
  <text x="50%" y="92" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13.5" font-weight="600" fill="#374151">FOR THE DISTRICT OF DELAWARE</text>
  <line x="50" y="108" x="630" y="108" stroke="#111827" stroke-width="1.5" />

  <rect x="60" y="140" width="560" height="150" fill="none" stroke="#374151" stroke-width="1.2" />
<line x="340" y="140" x="340" y="290" stroke="#374151" stroke-width="1.2" />
<text x="75" y="170" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#111827">IN RE:</text>
<text x="75" y="198" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#111827">FTX TRADING LTD., et al.</text>
<text x="75" y="260" font-family="'Times New Roman', serif" font-size="11" fill="#374151">Debtors.</text>
<text x="355" y="170" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#111827">Chapter 11</text>
<text x="355" y="198" font-family="'Times New Roman', serif" font-size="12" fill="#111827">Case No. 22-11068-JTD</text>
<text x="355" y="226" font-family="'Times New Roman', serif" font-size="12" fill="#111827">(Jointly Administered)</text>
<text x="50%" y="315" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">MOTION OF DEBTORS FOR ENTRY OF AN ORDER AUTHORIZING</text>
<text x="50%" y="339" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">CERTAIN CREDITORS PROCEDURES AND EMERGENCY RELIEF</text>
<text x="65" y="363" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#111827">1.</text>
<text x="90" y="363" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">On November 11, 2022, each of the Debtors filed a voluntary petition under Chapter 11 of the Bankruptcy Code.</text>
<text x="60" y="383" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="403" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="65" y="435" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#111827">2.</text>
<text x="90" y="435" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">The Debtors seek immediate relief regarding multi-billion dollar promotional endorsements and influencer contracts.</text>
<text x="60" y="455" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="475" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="65" y="507" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#111827">3.</text>
<text x="90" y="507" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">Never in my career have I seen such a complete failure of corporate controls and complete absence of trustworthy accounts.</text>
<text x="60" y="527" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="547" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="567" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>


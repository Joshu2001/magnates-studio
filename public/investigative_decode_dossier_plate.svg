<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="tungsten-spot" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="1"/>
      <stop offset="45%" stop-color="#0f1117" stop-opacity="1"/>
      <stop offset="85%" stop-color="#07080c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#030406" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="amber-cone" cx="50%" cy="36%" r="52%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper-grad-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7e0d0" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#a8a090" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="paper-grad-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfd7c6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#968e7e" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="micro-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.028)" stroke-width="1"/>
      <circle cx="48" cy="48" r="1" fill="rgba(245,158,11,0.12)"/>
    </pattern>
    <filter id="dof-blur-far" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="dof-blur-mid" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- Base Obsidian Darkroom Surface -->
  <rect width="1920" height="1080" fill="url(#tungsten-spot)"/>
  <rect width="1920" height="1080" fill="url(#micro-grid)"/>
  <rect width="1920" height="1080" fill="url(#amber-cone)"/>

  <!-- Left Angled Archival Dossier Sheet (Shallow Depth of Field) -->
  <g transform="translate(180, 140) rotate(-6.5)" filter="url(#dof-blur-far)" opacity="0.75">
    <rect x="0" y="0" width="520" height="680" rx="3" fill="url(#paper-grad-left)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <rect x="36" y="42" width="180" height="10" fill="rgba(245,158,11,0.22)"/>
    <rect x="36" y="68" width="440" height="2" fill="rgba(255,255,255,0.08)"/>
    <!-- Simulated Ledger Columns & Redaction Bars -->
    <rect x="36" y="96" width="260" height="16" fill="rgba(10,12,16,0.75)"/>
    <rect x="310" y="96" width="140" height="14" fill="rgba(255,255,255,0.06)"/>
    <rect x="36" y="128" width="380" height="10" fill="rgba(255,255,255,0.05)"/>
    <rect x="36" y="150" width="340" height="10" fill="rgba(255,255,255,0.05)"/>
    <rect x="36" y="174" width="220" height="18" fill="rgba(10,12,16,0.82)"/>
    <rect x="270" y="174" width="170" height="14" fill="rgba(245,158,11,0.18)"/>
    <rect x="36" y="210" width="420" height="10" fill="rgba(255,255,255,0.04)"/>
    <rect x="36" y="232" width="390" height="10" fill="rgba(255,255,255,0.04)"/>
    <rect x="36" y="256" width="310" height="18" fill="rgba(10,12,16,0.85)"/>
    <!-- Financial Table Grid -->
    <g transform="translate(36, 310)" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
      <rect x="0" y="0" width="440" height="220"/>
      <line x1="0" y1="44" x2="440" y2="44"/>
      <line x1="0" y1="88" x2="440" y2="88"/>
      <line x1="0" y1="132" x2="440" y2="132"/>
      <line x1="0" y1="176" x2="440" y2="176"/>
      <line x1="160" y1="0" x2="160" y2="220"/>
      <line x1="310" y1="0" x2="310" y2="220"/>
    </g>
  </g>

  <!-- Right Angled Classified SEC Exhibit Sheet (Shallow Depth of Field) -->
  <g transform="translate(1240, 190) rotate(5.2)" filter="url(#dof-blur-mid)" opacity="0.72">
    <rect x="0" y="0" width="500" height="650" rx="3" fill="url(#paper-grad-right)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="34" y="38" width="150" height="12" fill="rgba(239,68,68,0.22)"/>
    <rect x="34" y="64" width="420" height="2" fill="rgba(255,255,255,0.08)"/>
    <rect x="34" y="92" width="390" height="10" fill="rgba(255,255,255,0.05)"/>
    <rect x="34" y="114" width="290" height="18" fill="rgba(10,12,16,0.85)"/>
    <rect x="34" y="146" width="410" height="10" fill="rgba(255,255,255,0.05)"/>
    <rect x="34" y="168" width="360" height="10" fill="rgba(255,255,255,0.04)"/>
    <rect x="34" y="192" width="240" height="18" fill="rgba(10,12,16,0.82)"/>
    <!-- Topographic / Network Diagram Ring -->
    <circle cx="250" cy="390" r="110" fill="none" stroke="rgba(245,158,11,0.12)" stroke-width="1.2" stroke-dasharray="6 4"/>
    <circle cx="250" cy="390" r="68" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <line x1="120" y1="390" x2="380" y2="390" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="250" y1="260" x2="250" y2="520" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  </g>

  <!-- Subtle Architectural Framing Hairlines -->
  <g stroke="rgba(255,255,255,0.09)" stroke-width="1" fill="none">
    <line x1="96" y1="84" x2="1824" y2="84"/>
    <line x1="96" y1="996" x2="1824" y2="996"/>
    <!-- Corner Registration Marks -->
    <path d="M 96 108 L 96 84 L 120 84" stroke="rgba(245,158,11,0.45)" stroke-width="1.5"/>
    <path d="M 1824 108 L 1824 84 L 1800 84" stroke="rgba(245,158,11,0.45)" stroke-width="1.5"/>
    <path d="M 96 972 L 96 996 L 120 996" stroke="rgba(245,158,11,0.45)" stroke-width="1.5"/>
    <path d="M 1824 972 L 1824 996 L 1800 996" stroke="rgba(245,158,11,0.45)" stroke-width="1.5"/>
  </g>
</svg>

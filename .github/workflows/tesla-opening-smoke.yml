name: Tesla editable opening smoke
on:
  push:
    branches: [feature/tesla-editable-opening]
  pull_request:
    paths:
      - 'magnates-studio/public/tesla-opening.html'
      - 'magnates-studio/public/js/tesla-opening-engine.js'
      - 'tests/tesla-opening.cjs'
      - '.github/workflows/tesla-opening-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check magnates-studio/public/js/tesla-opening-engine.js
      - run: node tests/tesla-opening.cjs

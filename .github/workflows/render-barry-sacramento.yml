name: Render Barry Sacramento verification

on:
  push:
    branches: [main]
    paths:
      - 'magnates-studio/public/assets/barry-sacramento/**'
      - '.github/workflows/render-barry-sacramento.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render exact template frames
        run: |
          python3 -m http.server 8765 --directory magnates-studio/public >/tmp/barry-server.log 2>&1 &
          cat > /tmp/render.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('/tmp/barry_frames', { recursive: true });
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 });
          await page.goto('http://127.0.0.1:8765/assets/barry-sacramento/', {waitUntil:'networkidle'});
          await page.waitForSelector('#stage');
          await page.click('#play');
          const canvas = page.locator('#stage');
          const fps=24, duration=8, frames=fps*duration;
          for (let i=0;i<frames;i++) {
            const t=i/fps;
            await page.evaluate((time)=>{
              const scrub=document.getElementById('scrub');
              scrub.value=String(time);
              scrub.dispatchEvent(new Event('input',{bubbles:true}));
            }, t);
            await page.waitForTimeout(8);
            await canvas.screenshot({path:`/tmp/barry_frames/frame_${String(i).padStart(4,'0')}.png`});
          }
          await browser.close();
          JS
          node /tmp/render.mjs
      - name: Encode MP4
        run: |
          ffmpeg -y -framerate 24 -i /tmp/barry_frames/frame_%04d.png -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart Barry_Sacramento_Searchlight_Reveal_FIXED.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Barry-Sacramento-fixed-render
          path: Barry_Sacramento_Searchlight_Reveal_FIXED.mp4
          if-no-files-found: error

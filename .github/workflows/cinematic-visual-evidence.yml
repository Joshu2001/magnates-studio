name: Cinematic Visual Evidence
on:
  push:
    branches: [design/cinematic-reference-fidelity-audit]
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source contracts
        run: node scripts/verify-cinematic-reference-contract.cjs
      - name: Install app and Playwright
        run: |
          npm ci --prefix magnates-studio || npm install --prefix magnates-studio
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start application
        run: |
          (cd magnates-studio && PORT=3000 node server.js >../server.log 2>&1 &)
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then exit 0; fi; sleep 2; done
          cat server.log
          exit 1
      - name: Capture running editor
        run: node scripts/capture-cinematic-browser-evidence.cjs
      - name: Upload screenshots and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-browser-evidence
          path: |
            visual-evidence/
            server.log
          if-no-files-found: warn

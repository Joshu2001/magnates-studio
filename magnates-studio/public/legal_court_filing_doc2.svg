  <text x="50%" y="140" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">CLASS-ACTION COMPLAINT FOR MULTI-BILLION DAMAGES</text>
<text x="50%" y="164" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#111827" letter-spacing="1">VIOLATION OF THE SECURITIES EXCHANGE ACT OF 1934</text>
<text x="65" y="188" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#111827">12.</text>
<text x="90" y="188" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">Plaintiffs bring this nationwide class action on behalf of all retail purchasers who held unregistered accounts.</text>
<text x="60" y="208" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="228" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="65" y="260" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#111827">13.</text>
<text x="90" y="260" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">Defendants made false representations asserting that client custody funds were safely backed 1-to-1 at all times.</text>
<text x="60" y="280" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="300" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="65" y="332" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#111827">14.</text>
<text x="90" y="332" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">Promotional marketing deceptively portrayed high-risk speculative tokens as insured custodial reserve deposits.</text>
<text x="60" y="352" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="372" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>
<text x="60" y="392" font-family="'Times New Roman', serif" font-size="12" fill="#1f2937" letter-spacing="0.1">management repeatedly represented compliance with financial controls, yet commingled retail investor deposits.</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Dark Studio Vignette Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#090a12" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030407" stop-opacity="1" />
    </radialGradient>

    <!-- Regaarder Purple Glow -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Marker Highlight Gradient -->
    <linearGradient id="markerYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.85" />
    </linearGradient>

    <!-- Paper Texture Tone -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcfbf7" />
      <stop offset="100%" stop-color="#f4eee0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowPaper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7e22ce" flood-opacity="0.3" />
    </filter>

    <filter id="shadowPopout" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#facc15" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- 3D Perspective Horizon Grid Lines (Subtle Purple) -->
  <g stroke="#a855f7" stroke-opacity="0.15" stroke-width="1.2">
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="390" x2="800" y2="390" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <!-- Vanishing perspective lines -->
    <line x1="400" y1="180" x2="50" y2="450" />
    <line x1="400" y1="180" x2="180" y2="450" />
    <line x1="400" y1="180" x2="310" y2="450" />
    <line x1="400" y1="180" x2="400" y2="450" />
    <line x1="400" y1="180" x2="490" y2="450" />
    <line x1="400" y1="180" x2="620" y2="450" />
    <line x1="400" y1="180" x2="750" y2="450" />
  </g>

  <!-- Floating 3D Tilted Newspaper Document Plane -->
  <g transform="translate(190, 75) rotate(-9) skewX(-14) scale(0.92)" filter="url(#shadowPaper)">
    <!-- Base Paper Sheet -->
    <rect x="0" y="0" width="460" height="340" rx="4" fill="url(#paperGrad)" stroke="#e2d9c8" stroke-width="2" />

    <!-- Newspaper Header Band -->
    <line x1="28" y1="30" x2="432" y2="30" stroke="#1c1917" stroke-width="3" />
    <text x="230" y="52" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-weight="900" font-size="19" fill="#1c1917" text-anchor="middle" letter-spacing="3.5">
      THE FINANCIAL GAZETTE
    </text>
    <line x1="28" y1="62" x2="432" y2="62" stroke="#1c1917" stroke-width="1.2" />

    <!-- Dateline -->
    <text x="32" y="76" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#78716c" letter-spacing="1">
      SPECIAL INVESTIGATION REPORT — EXHIBIT A
    </text>
    <line x1="28" y1="84" x2="432" y2="84" stroke="#d6d3d1" stroke-width="1" />

    <!-- Main Headline (Elevated 3D Pop-Out Layer Simulation) -->
    <g transform="translate(0, 0)">
      <text x="32" y="116" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="21" fill="#0f172a">
        Uncovered Internal Files Reveal
      </text>
      <text x="32" y="142" font-family="'Playfair Display', Georgia, serif" font-weight="900" font-size="21" fill="#0f172a">
        $4.2B Algorithmic Market Shift
      </text>
    </g>

    <!-- Vox-Style Animated Yellow Marker Highlighter Overlay -->
    <rect x="30" y="180" width="370" height="28" rx="4" fill="url(#markerYellow)" />
    <text x="38" y="200" font-family="'Merriweather', Georgia, serif" font-weight="700" font-size="13.5" fill="#1e1b4b">
      "Full structural vulnerabilities known since Q3."
    </text>

    <!-- Classified Censor Bar (Redaction Leak) -->
    <rect x="30" y="222" width="220" height="18" rx="2" fill="#0a0a0a" />

    <!-- Paragraph Columns Mockup -->
    <g fill="#44403c" opacity="0.75">
      <rect x="32" y="254" width="180" height="6" rx="2" />
      <rect x="32" y="266" width="165" height="6" rx="2" />
      <rect x="32" y="278" width="185" height="6" rx="2" />
      <rect x="32" y="290" width="130" height="6" rx="2" />

      <rect x="235" y="254" width="185" height="6" rx="2" />
      <rect x="235" y="266" width="175" height="6" rx="2" />
      <rect x="235" y="278" width="190" height="6" rx="2" />
      <rect x="235" y="290" width="150" height="6" rx="2" />
    </g>
  </g>

  <!-- Foreground 3D Floating Pop-Out Headline Card (James Jani Z-Elevation) -->
  <g transform="translate(370, 230) rotate(-6)" filter="url(#shadowPopout)">
    <rect x="0" y="0" width="375" height="135" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
    
    <rect x="18" y="18" width="105" height="18" rx="4" fill="rgba(168,85,247,0.25)" />
    <text x="24" y="31" font-family="'Courier New', monospace" font-size="9.5" font-weight="800" fill="#c084fc">
      ● 3D Z-ELEVATION
    </text>

    <text x="18" y="64" font-family="'Cinzel', serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">
      THE ARCHITECT
    </text>

    <text x="18" y="94" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">
      "If you control the narrative, you control
    </text>
    <text x="18" y="112" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">
      the perception of reality itself."
    </text>

    <circle cx="345" cy="30" r="12" fill="#facc15" fill-opacity="0.2" />
    <text x="345" y="34" font-size="12" text-anchor="middle" fill="#facc15">✦</text>
  </g>

  <!-- Studio Badges and Overlays -->
  <g transform="translate(35, 35)">
    <rect width="180" height="28" rx="7" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#c084fc">
      REGAARDER JANI FX
    </text>
  </g>

  <g transform="translate(620, 35)">
    <rect width="145" height="28" rx="7" fill="rgba(234, 179, 8, 0.2)" stroke="rgba(234, 179, 8, 0.6)" stroke-width="1.2" />
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800" fill="#facc15">
      ★ 3D DOCUMENT
    </text>
  </g>
</svg>

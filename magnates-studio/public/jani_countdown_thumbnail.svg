<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="janiCountdownRadial" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#180407"/>
      <stop offset="60%" stop-color="#080204"/>
      <stop offset="100%" stop-color="#020001"/>
    </radialGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ef4444"/>
    </linearGradient>

    <linearGradient id="chartFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(239, 68, 68, 0.28)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#janiCountdownRadial)"/>

  <!-- Technical Grid -->
  <g stroke="rgba(239, 68, 68, 0.08)" stroke-width="1">
    <line x1="0" y1="35" x2="400" y2="35"/>
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="105" x2="400" y2="105"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="175" x2="400" y2="175"/>
    <line x1="40" y1="0" x2="40" y2="225"/>
    <line x1="80" y1="0" x2="80" y2="225"/>
    <line x1="120" y1="0" x2="120" y2="225"/>
    <line x1="160" y1="0" x2="160" y2="225"/>
    <line x1="200" y1="0" x2="200" y2="225"/>
    <line x1="240" y1="0" x2="240" y2="225"/>
    <line x1="280" y1="0" x2="280" y2="225"/>
    <line x1="320" y1="0" x2="320" y2="225"/>
    <line x1="360" y1="0" x2="360" y2="225"/>
  </g>

  <!-- Crashing Stock Chart Line & Area Fill -->
  <path d="M 0 90 L 50 82 L 95 95 L 140 78 L 190 105 L 240 120 L 290 160 L 340 178 L 400 188 L 400 225 L 0 225 Z" fill="url(#chartFillGrad)"/>
  <path d="M 0 90 L 50 82 L 95 95 L 140 78 L 190 105 L 240 120 L 290 160 L 340 178 L 400 188" fill="none" stroke="url(#chartLineGrad)" stroke-width="3"/>

  <!-- Top HUD Badges -->
  <rect x="14" y="12" width="130" height="18" rx="9" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="24" cy="21" r="3.5" fill="#ef4444"/>
  <text x="33" y="24" fill="#e4e4e7" font-family="'Share Tech Mono', monospace" font-size="8" font-weight="700" letter-spacing="1">LIVE PREVIEW</text>

  <rect x="330" y="12" width="56" height="18" rx="9" fill="rgba(0,0,0,0.7)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="343" y="24" fill="#a1a1aa" font-family="'Share Tech Mono', monospace" font-size="8">60 FPS</text>

  <!-- Timer Headline Label -->
  <text x="200" y="68" fill="#a1a1aa" font-family="'Chakra Petch', sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">
    FTX LIQUIDITY CRASH
  </text>

  <!-- Digital Countdown Clock (James Jani Crimson Panic) -->
  <g filter="url(#crimsonGlow)">
    <text x="200" y="112" fill="#ef4444" font-family="'Share Tech Mono', monospace" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="1">
      T-MINUS 00:03.420
    </text>
  </g>

  <!-- Panic Meter Underline -->
  <rect x="70" y="124" width="260" height="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="70" y="124" width="195" height="3" fill="#ef4444" filter="url(#crimsonGlow)"/>

  <!-- Warning Tag -->
  <text x="200" y="142" fill="#ef4444" font-family="'Chakra Petch', sans-serif" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">
    ⚠️ IMMINENT SYSTEMIC COLLAPSE
  </text>

  <!-- Dramatic Subtitle -->
  <text x="200" y="172" fill="#f4f4f5" font-family="'Playfair Display', serif" font-style="italic" font-size="10.5" text-anchor="middle">
    "And in less than 48 hours... $32 Billion vanished into thin air."
  </text>

  <!-- Stock Collapse Ticker Tape at Bottom -->
  <rect x="0" y="196" width="400" height="29" fill="rgba(9, 9, 11, 0.95)"/>
  <line x1="0" y1="196" x2="400" y2="196" stroke="#ef4444" stroke-width="1.5"/>
  <text x="14" y="214" fill="#f87171" font-family="'Share Tech Mono', monospace" font-size="9" font-weight="600">
    $FTT -94.2%  •  $BTC $15,820 (-22.4%)  •  BINANCE WITHDRAWALS PAUSED  •  $ETH $1,080 (-28.9%)
  </text>

  <!-- CRT Scanlines Overlay Simulation -->
  <g opacity="0.12">
    <line x1="0" y1="10" x2="400" y2="10" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="20" x2="400" y2="20" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="30" x2="400" y2="30" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="50" x2="400" y2="50" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="110" x2="400" y2="110" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="130" x2="400" y2="130" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#000" stroke-width="1"/>
    <line x1="0" y1="180" x2="400" y2="180" stroke="#000" stroke-width="1"/>
  </g>
</svg>

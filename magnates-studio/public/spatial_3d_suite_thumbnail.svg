<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1f1810" />
      <stop offset="60%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0d1017" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGlow)" />

  <!-- 3D Spatial Perspective Grid -->
  <g opacity="0.45" stroke="#d97706" stroke-width="1.2">
    <line x1="400" y1="180" x2="-100" y2="450" />
    <line x1="400" y1="180" x2="50" y2="450" />
    <line x1="400" y1="180" x2="200" y2="450" />
    <line x1="400" y1="180" x2="320" y2="450" />
    <line x1="400" y1="180" x2="400" y2="450" />
    <line x1="400" y1="180" x2="480" y2="450" />
    <line x1="400" y1="180" x2="600" y2="450" />
    <line x1="400" y1="180" x2="750" y2="450" />
    <line x1="400" y1="180" x2="900" y2="450" />

    <line x1="350" y1="220" x2="450" y2="220" />
    <line x1="300" y1="250" x2="500" y2="250" />
    <line x1="220" y1="290" x2="580" y2="290" />
    <line x1="120" y1="340" x2="680" y2="340" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Left Floating Dossier Card -->
  <g transform="translate(65, 85) rotate(7) scale(0.95)" opacity="0.88">
    <rect width="210" height="120" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="14" y="32" fill="#f59e0b" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="12" letter-spacing="0.8">CLASSIFIED REPORT</text>
    <text x="14" y="50" fill="#94a3b8" font-family="monospace" font-size="9">FINANCIAL SCAN #8941</text>
    <line x1="14" y1="60" x2="165" y2="60" stroke="#f59e0b" stroke-width="1.8" />
    <rect x="14" y="72" width="115" height="5.5" rx="3" fill="rgba(255,255,255,0.15)" />
    <rect x="14" y="84" width="155" height="5.5" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="14" y="96" width="85" height="5.5" rx="3" fill="rgba(245,158,11,0.3)" />
  </g>

  <!-- Right Floating Dossier Card -->
  <g transform="translate(525, 235) rotate(-6) scale(0.95)" opacity="0.88">
    <rect width="210" height="120" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="14" y="32" fill="#06b6d4" font-family="'Cinzel', Georgia, serif" font-weight="900" font-size="12" letter-spacing="0.8">GLOBAL MONOPOLY MAP</text>
    <text x="14" y="50" fill="#94a3b8" font-family="monospace" font-size="9">NETWORK NODES: 14,200 ACTIVE</text>
    <line x1="14" y1="60" x2="180" y2="60" stroke="#06b6d4" stroke-width="1.8" />
    <rect x="14" y="72" width="135" height="5.5" rx="3" fill="rgba(6,182,212,0.2)" />
    <rect x="14" y="84" width="95" height="5.5" rx="3" fill="rgba(255,255,255,0.1)" />
  </g>

  <!-- Dust Glow Particles -->
  <circle cx="180" cy="220" r="2.5" fill="#f59e0b" opacity="0.7" />
  <circle cx="290" cy="120" r="2" fill="#f59e0b" opacity="0.5" />
  <circle cx="460" cy="90" r="3" fill="#fbbf24" opacity="0.8" />
  <circle cx="620" cy="160" r="2.5" fill="#f59e0b" opacity="0.6" />
  <circle cx="380" cy="360" r="2" fill="#f59e0b" opacity="0.5" />
  <circle cx="680" cy="320" r="2" fill="#06b6d4" opacity="0.7" />

  <!-- Extruded Depth Bevel Layers -->
  <g transform="translate(400, 190)">
    <!-- Shadow & Bevel -->
    <rect x="-202" y="-73" width="404" height="146" rx="14" fill="#050608" opacity="0.95" />
    <rect x="-200" y="-71" width="400" height="142" rx="14" fill="#b45309" opacity="0.85" />
    <rect x="-198" y="-69" width="396" height="138" rx="13" fill="#78350f" opacity="0.9" />
    <rect x="-195" y="-66" width="390" height="132" rx="12" fill="#d97706" opacity="0.95" />

    <!-- Front Plate Face -->
    <rect x="-192" y="-63" width="384" height="126" rx="10" fill="url(#goldPlate)" stroke="#f59e0b" stroke-width="3" filter="url(#goldGlow)" />

    <!-- Title Typography -->
    <text x="0" y="-10" fill="#fef3c7" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-weight="900" font-size="36" letter-spacing="5" text-anchor="middle">THE SYSTEM</text>
    
    <line x1="-110" y1="8" x2="110" y2="8" stroke="#f59e0b" stroke-width="2.2" />

    <text x="0" y="32" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="11.5" letter-spacing="3" text-anchor="middle">MANIPULATION &amp; CONTROL</text>
  </g>
</svg>

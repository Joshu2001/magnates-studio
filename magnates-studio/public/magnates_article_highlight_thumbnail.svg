<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="news-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110b"/>
      <stop offset="50%" stop-color="#1f1a12"/>
      <stop offset="100%" stop-color="#0d0a06"/>
    </linearGradient>
    <filter id="paper-drop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="8" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#news-bg)"/>

  <!-- Panned Vintage Newspaper Page Clipping (Angled Perspective) -->
  <g transform="translate(80, 40) rotate(-2)" filter="url(#paper-drop)">
    <!-- Cream Newspaper Paper Sheet -->
    <rect width="640" height="370" rx="4" fill="#ede5d3" stroke="#b8a88a" stroke-width="1.5"/>

    <!-- Paper Header / Masthead -->
    <rect x="25" y="20" width="590" height="45" fill="none" stroke="#262118" stroke-width="2"/>
    <text x="320" y="48" font-family="'Playfair Display', 'Times New Roman', serif" font-size="28" font-weight="900" fill="#1f1911" text-anchor="middle" letter-spacing="4">THE FINANCIAL CHRONICLE</text>
    <text x="35" y="60" font-family="'Courier New', monospace" font-size="9" fill="#524738">VOL. XCIV NO. 28,401</text>
    <text x="595" y="60" font-family="'Courier New', monospace" font-size="9" fill="#524738" text-anchor="end">OCTOBER 1929  •  PRICE THREE CENTS</text>

    <!-- Headline -->
    <text x="320" y="105" font-family="'Playfair Display', serif" font-size="32" font-weight="900" fill="#110d07" text-anchor="middle" letter-spacing="1">
      BILLIONS VANISH AS MARKET COLLAPSES
    </text>

    <!-- Newspaper Multi-Column Layout -->
    <!-- Column 1 -->
    <g transform="translate(30, 125)">
      <rect width="180" height="210" fill="#e5dbc4" opacity="0.6"/>
      <rect x="0" y="0" width="180" height="95" fill="#332a1e"/>
      <circle cx="90" cy="40" r="24" fill="#d97706"/>
      <path d="M 60 95 C 60 70 120 70 120 95 Z" fill="#b45309"/>
      <!-- Body Lines -->
      <line x1="10" y1="110" x2="170" y2="110" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="125" x2="170" y2="125" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="140" x2="150" y2="140" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="155" x2="165" y2="155" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="170" x2="170" y2="170" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="185" x2="140" y2="185" stroke="#4a3e2c" stroke-width="4"/>
    </g>

    <!-- Column 2 (Active Focus Area with Dynamic Yellow Highlighter) -->
    <g transform="translate(230, 125)">
      <line x1="10" y1="15" x2="180" y2="15" stroke="#332919" stroke-width="5"/>
      <line x1="10" y1="35" x2="180" y2="35" stroke="#332919" stroke-width="5"/>
      
      <!-- YELLOW HIGHLIGHTER PEN STROKE #1 -->
      <rect x="5" y="48" width="185" height="22" rx="3" fill="#facc15" opacity="0.88" mix-blend-mode="multiply"/>
      <text x="12" y="64" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#000000" letter-spacing="0.5">
        UNPRECEDENTED PANIC
      </text>

      <line x1="10" y1="85" x2="180" y2="85" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="100" x2="160" y2="100" stroke="#4a3e2c" stroke-width="4"/>

      <!-- YELLOW HIGHLIGHTER PEN STROKE #2 -->
      <rect x="5" y="113" width="185" height="22" rx="3" fill="#facc15" opacity="0.88" mix-blend-mode="multiply"/>
      <text x="12" y="129" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#000000" letter-spacing="0.5">
        $14,000,000,000 LOST
      </text>

      <line x1="10" y1="150" x2="180" y2="150" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="165" x2="170" y2="165" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="180" x2="130" y2="180" stroke="#4a3e2c" stroke-width="4"/>
    </g>

    <!-- Column 3 -->
    <g transform="translate(430, 125)">
      <line x1="10" y1="15" x2="175" y2="15" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="30" x2="175" y2="30" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="45" x2="150" y2="45" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="60" x2="170" y2="60" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="75" x2="165" y2="75" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="90" x2="140" y2="90" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="105" x2="175" y2="105" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="120" x2="160" y2="120" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="135" x2="170" y2="135" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="150" x2="135" y2="150" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="165" x2="175" y2="165" stroke="#4a3e2c" stroke-width="4"/>
      <line x1="10" y1="180" x2="120" y2="180" stroke="#4a3e2c" stroke-width="4"/>
    </g>
  </g>

  <!-- Magnifying Camera Loupe / Zoom Bracket Reticle -->
  <g transform="translate(300, 170)">
    <rect x="0" y="0" width="220" height="95" rx="8" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8,6" filter="drop-shadow(0 0 10px rgba(245,158,11,0.5))"/>
    <text x="210" y="-8" font-family="monospace" font-size="10" font-weight="bold" fill="#f59e0b" text-anchor="end">ZOOM PAN: +220%</text>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(550, 30)">
    <rect width="220" height="34" rx="8" fill="#d97706" opacity="0.95"/>
    <text x="110" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">📰 ARTICLE HIGHLIGHT</text>
  </g>
</svg>
